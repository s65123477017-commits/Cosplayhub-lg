
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชุดคอสเพลย์ | CosplayHub</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== หน้ารายการชุด ===== */
        .costumes-main {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 28px 56px;
            box-sizing: border-box;
        }

        .costumes-header {
            margin-bottom: 24px;
        }

        .section-label {
            display: inline-block;
            margin-bottom: 8px;
            color: #7950df;
            font-size: 13px;
            font-weight: 700;
        }

        .costumes-header h1 {
            margin: 0 0 8px;
            color: #29213e;
            font-size: 30px;
            line-height: 1.4;
        }

        .costumes-header p {
            margin: 0;
            color: #81798e;
            font-size: 14px;
            line-height: 1.7;
        }

        /* ===== ช่องค้นหา ===== */
        .costume-search {
            margin-bottom: 24px;
            padding: 16px;
            background: #fff;
            border: 1px solid #eee8f8;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(69, 45, 112, 0.035);
        }

        .costume-search label {
            display: block;
            margin-bottom: 8px;
            color: #39304e;
            font-size: 13px;
            font-weight: 600;
        }

        .costume-search input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            box-sizing: border-box;
            border: 1px solid #e3dcef;
            border-radius: 10px;
            background: #fdfcff;
            color: #302744;
            font: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .costume-search input:focus {
            border-color: #8963e8;
            box-shadow: 0 0 0 3px rgba(137, 99, 232, 0.12);
        }

        .costume-search input::placeholder {
            color: #aaa2b8;
        }

        /* ===== กริดสินค้า ===== */
        .costume-list {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: stretch;
            gap: 20px;
        }

        /* ===== การ์ดสินค้า ===== */
        .costume-card {
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            border: 1px solid #eee8f6;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(72, 46, 120, 0.055);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .costume-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(72, 46, 120, 0.11);
        }

        /* ===== รูปและป้ายสถานะ ===== */
        .costume-image {
            position: relative;
            width: 100%;
            height: 230px;
            overflow: hidden;
            background: #f3eefb;
        }

        .costume-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.3s ease;
        }

        .costume-card:hover .costume-image img {
            transform: scale(1.035);
        }

        .costume-image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #968ba8;
            font-size: 13px;
        }

        .costume-image .costume-status {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1;
        }

        .costume-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.3;
        }

        .costume-status.available {
            color: #18794e;
            background: #e1f7eb;
        }

        .costume-status.unavailable {
            color: #b83f50;
            background: #fde8eb;
        }

        /* ===== เนื้อหาการ์ด ===== */
        .costume-content {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 15px;
        }

        .costume-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .costume-top h2 {
            min-width: 0;
            margin: 0;
            color: #2b2341;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        /* สถานะอยู่บนรูปแล้ว จึงซ่อนสถานะสำรองในส่วนหัว */
        .costume-top > .costume-status {
            display: none;
        }

        .costume-description {
            display: -webkit-box;
            min-height: 40px;
            margin: 8px 0 12px;
            overflow: hidden;
            color: #81798e;
            font-size: 12px;
            line-height: 1.7;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .costume-meta {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin: 0 0 14px;
            color: #766d86;
            font-size: 12px;
            line-height: 1.6;
        }

        .costume-meta span {
            display: block;
            overflow-wrap: anywhere;
        }

        .costume-meta span:empty {
            display: none;
        }

        /* ===== ปุ่มรายละเอียด ===== */
        .costume-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 40px;
            margin-top: auto;
            padding: 9px 12px;
            box-sizing: border-box;
            border: none;
            border-radius: 9px;
            background: #7950df;
            color: #fff;
            text-decoration: none;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.2s, transform 0.2s;
        }

        .costume-button::after {
            content: " →";
            margin-left: 5px;
        }

        .costume-button:hover {
            background: #633bc8;
            color: #fff;
            text-decoration: none;
        }

        .costume-button:active {
            transform: translateY(1px);
        }

        /* ===== ไม่มีสินค้า ===== */
        .costume-empty {
            grid-column: 1 / -1;
            padding: 56px 20px;
            text-align: center;
            background: #fff;
            border: 1px solid #eee8f6;
            border-radius: 15px;
        }

        .costume-empty h3 {
            margin: 0 0 8px;
            color: #302744;
            font-size: 18px;
        }

        .costume-empty p {
            margin: 0;
            color: #81798e;
            font-size: 13px;
            line-height: 1.7;
        }

        /* ===== แท็บเล็ต ===== */
        @media (max-width: 1100px) {
            .costume-list {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 16px;
            }

            .costume-image {
                height: 220px;
            }

            .costume-content {
                padding: 13px;
            }
        }

        @media (max-width: 800px) {
            .costumes-main {
                padding: 26px 20px 40px;
            }

            .costume-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }

            .costume-image {
                height: 220px;
            }
        }

        /* ===== โทรศัพท์ ===== */
        @media (max-width: 520px) {
            .costumes-main {
                padding: 22px 14px 32px;
            }

            .costumes-header h1 {
                font-size: 25px;
            }

            .costumes-header p {
                font-size: 13px;
            }

            .costume-search {
                padding: 13px;
            }

            .costume-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .costume-image {
                height: 155px;
            }

            .costume-image .costume-status {
                top: 7px;
                left: 7px;
                padding: 4px 7px;
                font-size: 10px;
            }

            .costume-content {
                padding: 10px;
            }

            .costume-top h2 {
                font-size: 13px;
            }

            .costume-description {
                min-height: 34px;
                margin: 6px 0 9px;
                font-size: 11px;
            }

            .costume-meta {
                gap: 5px;
                margin-bottom: 11px;
                font-size: 11px;
            }

            .costume-button {
                min-height: 36px;
                padding: 8px 5px;
                font-size: 11px;
            }
        }

        @media (max-width: 350px) {
            .costume-list {
                grid-template-columns: 1fr;
            }

            .costume-image {
                height: 220px;
            }
        }
    </style>
</head>

<body>
    <!-- ส่วนหัว -->
    <header class="home-header">
        <a href="home.html" class="home-logo">
            <img src="images/logo.png" alt="CosplayHub Logo">
            <span>CosplayHub</span>
        </a>

        <nav class="home-nav">
            <a href="home.html">หน้าแรก</a>
            <a href="costumes.html" class="active">ชุดคอสเพลย์</a>
            <a href="my-rentals.html">การเช่าของฉัน</a>
        </nav>

        <a href="index.html" class="logout-link">ออกจากระบบ</a>
    </header>

    <!-- เนื้อหาหลัก -->
    <main class="costumes-main">
        <section class="costumes-header">
            <span class="section-label">COSPLAY COLLECTION</span>
            <h1>รายการชุดคอสเพลย์</h1>
            <p>เลือกดูรายละเอียดชุดและตรวจสอบสถานะก่อนทำการจอง</p>
        </section>

        <!-- คงช่องค้นหาเดิม -->
        <section class="costume-search">
            <label for="costumeSearch">ค้นหาชุดคอสเพลย์</label>
            <input
                type="text"
                id="costumeSearch"
                placeholder="ค้นหาชื่อชุดหรือตัวละคร"
            >
        </section>

        <!-- ข้อมูลชุดจะถูกสร้างจาก localStorage -->
        <section class="costume-list" id="costumeList"></section>
    </main>

    <script>
        const costumeList = document.getElementById("costumeList");
        const searchInput = document.getElementById("costumeSearch");

        let costumes = [];

        try {
            costumes = JSON.parse(
                localStorage.getItem("cosplayHubCostumes")
            ) || [];
        } catch (error) {
            costumes = [];
            console.error("ไม่สามารถอ่านข้อมูลชุดคอสเพลย์ได้", error);
        }

        function getWigText(wig) {
            if (wig === "included") return "วิก: มีวิกในชุด";
            if (wig === "external") return "วิก: วิกจากภายนอก";
            if (wig === "none") return "วิก: ไม่มีวิก";
            return "";
        }

        function getPropText(prop) {
            if (prop === "included") return "พร็อพ: มีพร็อพในชุด";
            if (prop === "customer") return "พร็อพ: ลูกค้าจัดหาเอง";
            if (prop === "additional") return "พร็อพ: ร้านจัดหาเพิ่มเติม";
            if (prop === "none") return "พร็อพ: ไม่มีพร็อพ";
            return "";
        }

        function displayCostumes(list) {
            costumeList.innerHTML = "";

            if (list.length === 0) {
                costumeList.innerHTML = `
                    <div class="costume-empty">
                        <h3>ยังไม่มีชุดคอสเพลย์</h3>
                        <p>เมื่อร้านเพิ่มชุด ชุดจะแสดงในหน้านี้</p>
                    </div>
                `;
                return;
            }

            list.forEach(function (costume) {
                const card = document.createElement("article");
                card.className = "costume-card";

                const isAvailable = costume.status === "available";
                const statusText = isAvailable ? "ว่าง" : "ไม่ว่าง";
                const statusClass = isAvailable ? "available" : "unavailable";

                const imageHTML = costume.image
                    ? `<img
                            src="${costume.image}"
                            alt="${costume.name || "ชุดคอสเพลย์"}"
                            loading="lazy"
                        >`
                    : `<span class="costume-image-placeholder">ไม่มีรูปชุด</span>`;

                const costumeSet = costume.costumeSet
                    ? `<span>ตัวชุด: ${costume.costumeSet}</span>`
                    : "";

                const wigText = getWigText(costume.wig);
                const wigHTML = wigText ? `<span>${wigText}</span>` : "";

                const propText = getPropText(costume.prop);
                const propHTML = propText ? `<span>${propText}</span>` : "";

                const additionalCostHTML =
                    costume.additionalCost !== undefined &&
                    costume.additionalCost !== null &&
                    costume.additionalCost !== "" &&
                    Number(costume.additionalCost) !== 0
                    ? `<span>ค่าใช้จ่ายเพิ่มเติม: ${costume.additionalCost} บาท</span>`
                    : "";

                card.innerHTML = `
                    <div class="costume-image">
                        ${imageHTML}
                        <span class="costume-status ${statusClass}">
                            ${statusText}
                        </span>
                    </div>

                    <div class="costume-content">
                        <div class="costume-top">
                            <h2>${costume.name || "ไม่ระบุชื่อชุด"}</h2>
                        </div>

                        <p class="costume-description">
                            ${costume.description || "ไม่มีรายละเอียดชุด"}
                        </p>

                        <div class="costume-meta">
                            ${costumeSet}
                            ${wigHTML}
                            ${propHTML}
                            ${additionalCostHTML}
                        </div>

                        <a
                            href="costume-detail.html?id=${encodeURIComponent(costume.id)}"
                            class="costume-button"
                        >ดูรายละเอียด</a>
                    </div>
                `;

                costumeList.appendChild(card);
            });
        }

        searchInput.addEventListener("input", function () {
            const keyword = searchInput.value.trim().toLowerCase();

            const filteredCostumes = costumes.filter(function (costume) {
                const name = (costume.name || "").toLowerCase();
                const description = (costume.description || "").toLowerCase();
                const costumeSet = (costume.costumeSet || "").toLowerCase();

                return (
                    name.includes(keyword) ||
                    description.includes(keyword) ||
                    costumeSet.includes(keyword)
                );
            });

            displayCostumes(filteredCostumes);
        });

        displayCostumes(costumes);
    </script>
</body>
</html>
